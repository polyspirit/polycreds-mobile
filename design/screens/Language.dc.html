<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Язык</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">
<div style="height: 44px; display: flex; align-items: center; margin: 0 -10px">
<a href="Settings.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; padding-right: 8px; color: {{t.accent}}; text-decoration: none; font-size: 17px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Настройки</a>
</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Язык</h1>
<div role="radiogroup" aria-label="Язык интерфейса" style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
<button role="radio" aria-checked="{{l.checked}}" style="width: 100%; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 16px; border: 0; border-top: {{l.sep}}; background: transparent; color: {{t.text}}; font: inherit; text-align: left">
<span style="width: 36px; height: 36px; border-radius: 10px; background: {{l.tileBg}}; color: {{l.tileFg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600">{{l.code}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: {{l.weight}}">{{l.name}}</span>
<span style="font-size: 14px; color: {{t.text2}}">{{l.sub}}</span>
</span>
<sc-if value="{{l.on}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
</button>
</sc-for>
</div>
<p style="margin: 0 4px; font-size: 13px; line-height: 1.45; color: {{t.text2}}">Язык меняется сразу, перезапуск не нужен. Записи в хранилище не переводятся.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F3F4F7',surface:'#FFFFFF',surface2:'#E9ECF1',text:'#15171C',text2:'#596072',text3:'#6B7284',border:'#E0E3EA',accent:'#2A55D0',accentSoft:'#E5EBFA',onAccent:'#FFFFFF',danger:'#B8322A',dangerSoft:'#FBE9E7',success:'#1C7447',successSoft:'#E3F2EA',star:'#B7791F',scrim:'rgba(13,15,20,.45)',tab:'rgba(255,255,255,.94)'};
const D={bg:'#0D0F14',surface:'#161920',surface2:'#1F232C',text:'#ECEEF3',text2:'#A0A7B6',text3:'#8A91A1',border:'#2A2F3A',accent:'#7C9CFF',accentSoft:'#1B2542',onAccent:'#0B1020',danger:'#FF8A80',dangerSoft:'#3A1A19',success:'#6FD39E',successSoft:'#15301F',star:'#F0B44C',scrim:'rgba(0,0,0,.6)',tab:'rgba(22,25,32,.96)'};
const t=this.props.dark?D:L;
const langs=[['АВТО','Как в системе','Сейчас: русский',0],['RU','Русский','Russian',1],['EN','English','Английский',0]].map((l,i)=>({code:l[0],name:l[1],sub:l[2],on:!!l[3],checked:l[3]?'true':'false',weight:l[3]?'600':'400',tileBg:l[3]?t.accentSoft:t.surface2,tileFg:l[3]?t.accent:t.text2,sep:i?'1px solid '+t.border:'0'}));
return { t, langs };
}
}
</script>
</body>
</html>
