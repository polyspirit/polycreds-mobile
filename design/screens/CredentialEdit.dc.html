<x-dc>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">

</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: {{t.text2}}">Название</span>

<label style="display: flex; flex-direction: column; gap: 6px">

<div style="display: flex; align-items: center; gap: 8px">
<div style="flex-grow: 1; display: flex; gap: 4px"><span style="flex: 1; height: 4px; border-radius: 2px; background: {{t.success}}"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{t.success}}"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{t.success}}"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: {{t.success}}"></span></div>
<span style="font-size: 13px; font-weight: 600; color: {{t.success}}">Надёжный</span>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: {{t.text2}}">Ссылка</span>
<input placeholder="https://" value="figma.com" style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 16px; outline: none">
</label>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: {{t.text2}}">Заметка</span>
<textarea placeholder="Резервные коды, подсказки, всё остальное" style="height: 64px; padding: 12px 14px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 16px; resize: none; outline: none; box-sizing: border-box"></textarea>
</label>
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<span id="fav" style="display: flex; align-items: center; gap: 8px; font-size: 16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.star}}" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg>В избранное</span>

</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

}
