<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Код подтверждения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 24px 40px; display: flex; flex-direction: column; gap: 28px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">
<div style="height: 44px; display: flex; align-items: center; margin-left: -10px">
<a href="Login.dc.html" aria-label="Назад" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.accent}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<div style="width: 56px; height: 56px; border-radius: 16px; background: {{t.accentSoft}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Код из письма</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.45; color: {{t.text2}}">Отправили 6-значный код на <span style="color: {{t.text}}; font-weight: 600">p***@example.com</span>. Введите его, чтобы подтвердить вход.</p>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="6">
<div style="flex: 1; height: 60px; border-radius: 12px; border: {{c.border}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 600">{{c.v}}</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: {{t.text2}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>
Отправить повторно через <span style="font-family: 'JetBrains Mono', monospace; color: {{t.text}}">0:42</span>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; flex-direction: column; gap: 14px">
<a href="PinCreate.dc.html" style="height: 54px; border-radius: 14px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Подтвердить</a>
<p style="margin: 0; text-align: center; font-size: 14px; line-height: 1.45; color: {{t.text2}}">Не пришло письмо? Проверьте «Спам». Повторная отправка — до 3 раз в минуту.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F3F4F7',surface:'#FFFFFF',surface2:'#E9ECF1',text:'#15171C',text2:'#596072',text3:'#6B7284',border:'#E0E3EA',accent:'#2A55D0',accentSoft:'#E5EBFA',onAccent:'#FFFFFF',danger:'#B8322A',dangerSoft:'#FBE9E7',success:'#1C7447',successSoft:'#E3F2EA',star:'#B7791F',scrim:'rgba(13,15,20,.45)',tab:'rgba(255,255,255,.94)'};
const D={bg:'#0D0F14',surface:'#161920',surface2:'#1F232C',text:'#ECEEF3',text2:'#A0A7B6',text3:'#8A91A1',border:'#2A2F3A',accent:'#7C9CFF',accentSoft:'#1B2542',onAccent:'#0B1020',danger:'#FF8A80',dangerSoft:'#3A1A19',success:'#6FD39E',successSoft:'#15301F',star:'#F0B44C',scrim:'rgba(0,0,0,.6)',tab:'rgba(22,25,32,.96)'};
const t=this.props.dark?D:L;
const cells=['4','8','1','','',''].map((v,i)=>({v,border:i===3?'2px solid '+t.accent:'1px solid '+t.border}));
return { t, cells };
}
}
</script>
</body>
</html>
