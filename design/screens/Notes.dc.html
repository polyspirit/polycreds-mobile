<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Заметки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 62px 20px 0; display: flex; flex-direction: column; gap: 16px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Заметки</h1>
<a href="NoteEdit.dc.html" aria-label="Новая заметка" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: {{t.surface2}}; color: {{t.text3}}; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input placeholder="Поиск по заметкам" style="flex-grow: 1; border: 0; background: transparent; font: inherit; font-size: 16px; color: {{t.text}}; outline: none">
</label>
<div style="display: flex; gap: 8px">
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: {{t.text}}; color: {{t.bg}}; font: inherit; font-size: 14px; font-weight: 600">Все · 14</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px">Избранное</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px">Разработка</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px">Личное</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="5">
<a href="Note.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; text-decoration: none; color: {{t.text}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex-grow: 1; font-size: 16px; font-weight: 600">{{n.title}}</span>
<sc-if value="{{n.fav}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{t.star}}" stroke="{{t.star}}" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg></sc-if>
</div>
<div style="font-size: 14px; line-height: 1.4; color: {{t.text2}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{n.preview}}</div>
<div style="font-size: 12px; color: {{t.text3}}">{{n.meta}}</div>
</a>
</sc-for>
</div>
<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 26px; display: flex; background: {{t.tab}}; border-top: 1px solid {{t.border}}">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.text2}}; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3 20 3M16 7l3 3M14 9l2 2"></path></svg>Хранилище</a>
<a href="Notes.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.accent}}; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Заметки</a>
<a href="Generator.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.text2}}; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" stroke-width="3"></path></svg>Генератор</a>
<a href="Profile.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.text2}}; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Профиль</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F3F4F7',surface:'#FFFFFF',surface2:'#E9ECF1',text:'#15171C',text2:'#596072',text3:'#6B7284',border:'#E0E3EA',accent:'#2A55D0',accentSoft:'#E5EBFA',onAccent:'#FFFFFF',danger:'#B8322A',dangerSoft:'#FBE9E7',success:'#1C7447',successSoft:'#E3F2EA',star:'#B7791F',scrim:'rgba(13,15,20,.45)',tab:'rgba(255,255,255,.94)'};
const D={bg:'#0D0F14',surface:'#161920',surface2:'#1F232C',text:'#ECEEF3',text2:'#A0A7B6',text3:'#8A91A1',border:'#2A2F3A',accent:'#7C9CFF',accentSoft:'#1B2542',onAccent:'#0B1020',danger:'#FF8A80',dangerSoft:'#3A1A19',success:'#6FD39E',successSoft:'#15301F',star:'#F0B44C',scrim:'rgba(0,0,0,.6)',tab:'rgba(22,25,32,.96)'};
const t=this.props.dark?D:L;
const notes=[
['GitHub recovery','Резервные коды двухфакторной аутентификации. Использованные вычёркивать.','Разработка · 20 сентября',1],
['Git: полезные команды','rebase -i HEAD~3, затем git push --force-with-lease. Чистка веток: git fetch -p.','Разработка · 18 сентября',0],
['Wi-Fi дома и на даче','Сеть дома: Poly_5G. Дача — роутер в шкафу, пароль на наклейке снизу.','Личное · 2 сентября',1],
['Реквизиты ИП','ИНН, ОГРНИП, расчётный счёт и БИК банка для счетов клиентам.','Документы · 14 августа',0],
['Ключи от VPS','Где лежат приватные ключи и кто имеет доступ к серверам.','Разработка · 30 июля',0]
].map(n=>({title:n[0],preview:n[1],meta:n[2],fav:!!n[3]}));
return { t, notes };
}
}
</script>
</body>
</html>
