<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Устройства</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 20px 40px; display: flex; flex-direction: column; gap: 14px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">
<div style="height: 44px; display: flex; align-items: center; margin: 0 -10px">
<a href="Profile.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; padding-right: 8px; color: {{t.accent}}; text-decoration: none; font-size: 17px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Профиль</a>
</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Устройства</h1>
<div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: {{t.text2}}">Это устройство</div>
<div style="display: flex; gap: 14px; padding: 16px; border-radius: 16px; background: {{t.surface}}; border: 2px solid {{t.success}}">
<div style="width: 44px; height: 44px; border-radius: 12px; background: {{t.successSoft}}; color: {{t.success}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 16px; font-weight: 600">iPhone · PolyCreds</div>
<div style="font-size: 14px; color: {{t.text2}}">Активен сейчас</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{t.text2}}">IP 185.12.64.7</div>
</div>
</div>
<div style="margin-top: 6px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: {{t.text2}}">Другие сеансы · 2</div>
<div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden">
<sc-for list="{{others}}" as="s" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 14px; padding: 14px 12px 14px 16px; border-top: {{s.sep}}">
<div style="width: 44px; height: 44px; border-radius: 12px; background: {{t.surface2}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<sc-if value="{{s.phone}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></sc-if>
<sc-if value="{{s.tablet}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><path d="M11 18h2"></path></svg></sc-if>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-size: 16px; font-weight: 600">{{s.name}}</div>
<div style="font-size: 14px; color: {{t.text2}}">{{s.when}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{t.text2}}">{{s.ip}}</div>
</div>
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: transparent; color: {{t.danger}}; font: inherit; font-size: 14px; font-weight: 600">Завершить</button>
</div>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<button style="height: 52px; border-radius: 14px; border: 0; background: {{t.dangerSoft}}; color: {{t.danger}}; font: inherit; font-size: 16px; font-weight: 600">Завершить все другие сеансы</button>
<p style="margin: 0; text-align: center; font-size: 13px; line-height: 1.45; color: {{t.text2}}">На завершённых устройствах понадобится снова войти с кодом из письма.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F3F4F7',surface:'#FFFFFF',surface2:'#E9ECF1',text:'#15171C',text2:'#596072',text3:'#6B7284',border:'#E0E3EA',accent:'#2A55D0',accentSoft:'#E5EBFA',onAccent:'#FFFFFF',danger:'#B8322A',dangerSoft:'#FBE9E7',success:'#1C7447',successSoft:'#E3F2EA',star:'#B7791F',scrim:'rgba(13,15,20,.45)',tab:'rgba(255,255,255,.94)'};
const D={bg:'#0D0F14',surface:'#161920',surface2:'#1F232C',text:'#ECEEF3',text2:'#A0A7B6',text3:'#8A91A1',border:'#2A2F3A',accent:'#7C9CFF',accentSoft:'#1B2542',onAccent:'#0B1020',danger:'#FF8A80',dangerSoft:'#3A1A19',success:'#6FD39E',successSoft:'#15301F',star:'#F0B44C',scrim:'rgba(0,0,0,.6)',tab:'rgba(22,25,32,.96)'};
const t=this.props.dark?D:L;
const others=[['Pixel 8 · PolyCreds','Был активен 2 дня назад','IP 94.25.170.3',1],['iPad · PolyCreds','Был активен 3 недели назад','IP 185.12.64.7',0]].map((s,i)=>({name:s[0],when:s[1],ip:s[2],phone:!!s[3],tablet:!s[3],sep:i?'1px solid '+t.border:'0'}));
return { t, others };
}
}
</script>
</body>
</html>
