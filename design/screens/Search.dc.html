<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 10px">
<label style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 8px 0 14px; border-radius: 12px; background: {{t.surface2}}; color: {{t.text3}}; box-sizing: border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input value="git" aria-label="Поиск" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; color: {{t.text}}; outline: none">
<button aria-label="Очистить" style="width: 28px; height: 28px; border-radius: 14px; border: 0; background: {{t.text3}}; color: {{t.surface2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</label>
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 16px; color: {{t.accent}}; text-decoration: none">Отмена</a>
</div>
<div style="display: flex; gap: 8px">
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: {{t.text}}; color: {{t.bg}}; font: inherit; font-size: 14px; font-weight: 600">Все · 5</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px">Доступы · 3</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px">Заметки · 1</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px">Группы · 1</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: {{t.text2}}">Доступы</div>
<div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden">
<sc-for list="{{creds}}" as="c" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 6px 0 14px; border-top: {{c.sep}}">
<div style="width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: {{c.tileBg}}; color: {{c.tileFg}}; display: flex; align-items: center; justify-content: center; font-weight: 700">{{c.letter}}</div>
<a href="Credential.dc.html" style="flex-grow: 1; min-width: 0; text-decoration: none; color: {{t.text}}">
<div style="font-size: 16px; font-weight: 500"><span style="color: {{t.accent}}; font-weight: 700">{{c.m}}</span>{{c.rest}}</div>
<div style="font-size: 13px; color: {{t.text2}}">{{c.sub}}</div>
</a>
<button aria-label="Скопировать пароль" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg></button>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: {{t.text2}}">Заметки</div>
<a href="Note.dc.html" style="display: flex; gap: 12px; padding: 14px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; text-decoration: none; color: {{t.text}}">
<div style="width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: {{t.surface2}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 16px; font-weight: 500"><span style="color: {{t.accent}}; font-weight: 700">Git</span>: полезные команды</div>
<div style="font-size: 14px; line-height: 1.4; color: {{t.text2}}">…rebase -i HEAD~3, затем <span style="color: {{t.text}}; font-weight: 600">git</span> push --force-with-lease…</div>
</div>
</a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: {{t.text2}}">Группы</div>
<a href="Group.dc.html" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; text-decoration: none; color: {{t.text}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="flex-grow: 1; font-size: 16px"><span style="color: {{t.accent}}; font-weight: 700">Git</span>-репозитории</span>
<span style="font-size: 14px; color: {{t.text2}}">4</span>
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F3F4F7',surface:'#FFFFFF',surface2:'#E9ECF1',text:'#15171C',text2:'#596072',text3:'#6B7284',border:'#E0E3EA',accent:'#2A55D0',accentSoft:'#E5EBFA',onAccent:'#FFFFFF',danger:'#B8322A',dangerSoft:'#FBE9E7',success:'#1C7447',successSoft:'#E3F2EA',star:'#B7791F',scrim:'rgba(13,15,20,.45)',tab:'rgba(255,255,255,.94)'};
const D={bg:'#0D0F14',surface:'#161920',surface2:'#1F232C',text:'#ECEEF3',text2:'#A0A7B6',text3:'#8A91A1',border:'#2A2F3A',accent:'#7C9CFF',accentSoft:'#1B2542',onAccent:'#0B1020',danger:'#FF8A80',dangerSoft:'#3A1A19',success:'#6FD39E',successSoft:'#15301F',star:'#F0B44C',scrim:'rgba(0,0,0,.6)',tab:'rgba(22,25,32,.96)'};
const t=this.props.dark?D:L;
const creds=[
['G','Git','Hub','Работа · polyspirit',0],
['G','Git','Lab','Работа · poly@company.dev',0],
['S','Git','ea · self-hosted','Серверы · SSH · git',1]
].map((c,i)=>({letter:c[0],m:c[1],rest:c[2],sub:c[3],tileBg:c[4]?t.successSoft:t.accentSoft,tileFg:c[4]?t.success:t.accent,sep:i?'1px solid '+t.border:'0'}));
return { t, creds };
}
}
</script>
</body>
</html>
