<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Группа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px; background: {{t.bg}}; color: {{t.text}}; font-family: Onest, system-ui, sans-serif">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; margin: 0 -10px">
<a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; padding-right: 8px; color: {{t.accent}}; text-decoration: none; font-size: 17px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Хранилище</a>
<div style="display: flex">
<a href="GroupEdit.dc.html" aria-label="Изменить группу" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.accent}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="m13.5 6.5 4 4"></path></svg></a>
<a href="CredentialEdit.dc.html" aria-label="Новый доступ в группе" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.accent}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div>
<h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.5px">Работа</h1>
<div style="margin-top: 2px; font-size: 15px; color: {{t.text2}}">12 доступов</div>
</div>
<button style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 18px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>По имени</button>
</div>
<div style="border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden">
<sc-for list="{{creds}}" as="c" hint-placeholder-count="9">
<div style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 6px 0 14px; border-top: {{c.sep}}">
<sc-if value="{{c.remote}}" hint-placeholder-val="{{false}}">
<div style="width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: {{t.successSoft}}; color: {{t.success}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg></div>
</sc-if>
<sc-if value="{{c.web}}" hint-placeholder-val="{{true}}">
<div style="width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: {{t.accentSoft}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center; font-weight: 700">{{c.letter}}</div>
</sc-if>
<a href="{{c.href}}" style="flex-grow: 1; min-width: 0; text-decoration: none; color: {{t.text}}">
<div style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 500">{{c.name}}<sc-if value="{{c.fav}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="{{t.star}}" stroke="{{t.star}}" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg></sc-if></div>
<div style="font-size: 13px; color: {{t.text2}}">{{c.sub}}</div>
</a>
<button aria-label="Скопировать пароль" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h8"></path></svg></button>
</div>
</sc-for>
</div>
<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 26px; display: flex; background: {{t.tab}}; border-top: 1px solid {{t.border}}">
<a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.accent}}; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3 20 3M16 7l3 3M14 9l2 2"></path></svg>Хранилище</a>
<a href="Notes.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.text2}}; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M14 3v6h6M8 13h8M8 17h5"></path></svg>Заметки</a>
<a href="Generator.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.text2}}; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" stroke-width="3"></path></svg>Генератор</a>
<a href="Profile.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.text2}}; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Профиль</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F3F4F7',surface:'#FFFFFF',surface2:'#E9ECF1',text:'#15171C',text2:'#596072',text3:'#6B7284',border:'#E0E3EA',accent:'#2A55D0',accentSoft:'#E5EBFA',onAccent:'#FFFFFF',danger:'#B8322A',dangerSoft:'#FBE9E7',success:'#1C7447',successSoft:'#E3F2EA',star:'#B7791F',scrim:'rgba(13,15,20,.45)',tab:'rgba(255,255,255,.94)'};
const D={bg:'#0D0F14',surface:'#161920',surface2:'#1F232C',text:'#ECEEF3',text2:'#A0A7B6',text3:'#8A91A1',border:'#2A2F3A',accent:'#7C9CFF',accentSoft:'#1B2542',onAccent:'#0B1020',danger:'#FF8A80',dangerSoft:'#3A1A19',success:'#6FD39E',successSoft:'#15301F',star:'#F0B44C',scrim:'rgba(0,0,0,.6)',tab:'rgba(22,25,32,.96)'};
const t=this.props.dark?D:L;
const creds=[
['Confluence','poly@company.dev',0,0],
['FTP · static','FTP · upload@static.company.dev',1,0],
['Figma','poly@example.com',0,0],
['GitHub','polyspirit',0,1],
['GitLab','poly@company.dev',0,0],
['Jira','poly@company.dev',0,0],
['Prod · web-01','SSH · root@10.0.0.12',1,1],
['Stage · db','SSH · deploy@10.0.1.5',1,0],
['Slack','poly@company.dev',0,0]
].map((c,i)=>({name:c[0],sub:c[1],letter:c[0][0],remote:!!c[2],web:!c[2],fav:!!c[3],href:c[2]?'CredentialRemote.dc.html':'Credential.dc.html',sep:i?'1px solid '+t.border:'0'}));
return { t, creds };
}
}
</script>
</body>
</html>
